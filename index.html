<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sofnade — Bubble Tea, Sweets, Snacks & Gift Sets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=16">
</head>
<body>
  <div id="header"></div>

  <section class="hero">
    <div class="wrap">
      <h1>Crafted fresh.<br>Since 2015.</h1>
      <p>Hand-shaken bubble tea, freshly baked sweets, wholesome snacks and giftable sets, delivered across Singapore.</p>
    </div>
  </section>

  <div class="wrap">
    <div class="shop-layout">
      <!-- Sidebar category / tag filter -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Product grid -->
      <main>
        <div class="listing-head">
          <h2 id="listing-title">All Products</h2>
          <span class="count" id="listing-count"></span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty-state" id="empty" style="display:none">
          <div class="big">🔍</div>
          <p>No products match this filter just yet.</p>
        </div>
      </main>
    </div>
  </div>

  <div id="footer"></div>

  <script src="data/products.js?v=16"></script>
  <script src="js/images.js?v=16"></script>
  <script src="js/cart.js?v=16"></script>
  <script src="js/common.js?v=16"></script>
  <script>
    renderChrome('shop');

    // Active filter comes from ?cat= so nav links + sidebar stay in sync.
    let activeFilter = param('cat'); // null = All

    function renderSidebar() {
      const mkBtn = (val, label) => {
        const active = (activeFilter === val) || (!activeFilter && val === '') ? 'active' : '';
        return `<button class="filter-btn ${active}" data-filter="${val}">${label}</button>`;
      };
      const pills = [mkBtn('', 'All')]
        .concat(filterCategories().map(c => mkBtn(c, c)))
        .join('');
      document.getElementById('sidebar').innerHTML = `<div class="filter-bar">${pills}</div>`;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter || null;
          const url = new URL(location);
          if (activeFilter) url.searchParams.set('cat', activeFilter);
          else url.searchParams.delete('cat');
          history.replaceState({}, '', url);
          render();
        });
      });

      // Keep the active pill in view on the mobile scroll bar.
      const activeBtn = document.querySelector('.filter-btn.active');
      const bar = document.querySelector('.filter-bar');
      if (activeBtn && bar) bar.scrollLeft = activeBtn.offsetLeft - 16;
    }

    function productCard(p) {
      // Show only the headline category (cross tags stay internal).
      const cat = primaryCategory(p);
      const chips = cat ? `<span class="tag-chip cat">${cat}</span>` : '';
      return `
        <article class="card">
          <a class="card-media" href="product.html?id=${p.id}">
            <div class="card-tags">${chips}</div>
            <img src="${productImage(p, 0)}" alt="${p.title}" loading="lazy">
          </a>
          <div class="card-body">
            <h3><a href="product.html?id=${p.id}">${p.title}</a></h3>
            <p class="card-desc">${p.shortDesc}</p>
            <div class="card-foot">
              <span class="price">${hasSizeChoice(p) ? '<span class="from">from </span>' : ''}${money(p.price)}<span class="from"> / ${p.unit}</span></span>
              <a class="btn ghost" href="product.html?id=${p.id}">View</a>
            </div>
          </div>
        </article>`;
    }

    function render() {
      renderSidebar();
      const list = activeFilter
        ? PRODUCTS.filter(p => p.tags.includes(activeFilter))
        : PRODUCTS;
      document.getElementById('listing-title').textContent = activeFilter || 'All Products';
      document.getElementById('listing-count').textContent =
        `${list.length} ${list.length === 1 ? 'item' : 'items'}`;
      document.getElementById('grid').innerHTML = list.map(productCard).join('');
      document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    }

    render();
  </script>
</body>
</html>
