<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sofnade — Bubble Tea, Sweets, Snacks & Gift Sets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a8a'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffc629'%3ES%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=28">
</head>
<body>
  <div id="header"></div>

  <section class="hero">
    <div class="wrap">
      <h1 id="hero-title">Crafted fresh.<br>Since 2015.</h1>
      <p id="hero-subtitle">Hand-shaken bubble tea, freshly baked sweets, wholesome snacks and giftable sets, delivered across Singapore.</p>
    </div>
  </section>

  <div class="wrap">
    <div class="searchbar">
      <span class="searchbar-icon" aria-hidden="true">🔍</span>
      <input id="search-input" class="searchbar-input" type="search"
             placeholder="Search bubble tea, snacks, gift sets…"
             aria-label="Search products" autocomplete="off">
      <button id="search-clear" class="searchbar-clear" type="button" aria-label="Clear search" hidden>×</button>
    </div>
  </div>

  <div class="wrap">
    <div class="shop-layout">
      <!-- Sidebar category / tag filter -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Product grid -->
      <main>
        <div id="subnav"></div>
        <div class="listing-head">
          <h2 id="listing-title">All Products</h2>
          <span class="count" id="listing-count"></span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="empty-state" id="empty" style="display:none">
          <div class="big">🔍</div>
          <p>No products match this filter just yet.</p>
        </div>
      </main>
    </div>
  </div>

  <div id="footer"></div>

  <script src="data/products.js?v=28"></script>
  <script src="js/config.js?v=28"></script>
  <script src="js/store-data.js?v=28"></script>
  <script src="js/images.js?v=28"></script>
  <script src="js/cart.js?v=28"></script>
  <script src="js/common.js?v=28"></script>
  <script>
    renderChrome('shop');

    // Active filter comes from ?cat= so nav links + sidebar stay in sync.
    let activeFilter = param('cat'); // null = All
    let activeSub = param('sub');    // sub-section within a category (e.g. Milk Teas)
    let searchQuery = (param('q') || '').trim(); // free-text product search

    function updateUrl() {
      const url = new URL(location);
      activeFilter ? url.searchParams.set('cat', activeFilter) : url.searchParams.delete('cat');
      activeSub ? url.searchParams.set('sub', activeSub) : url.searchParams.delete('sub');
      searchQuery ? url.searchParams.set('q', searchQuery) : url.searchParams.delete('q');
      history.replaceState({}, '', url);
    }

    // Reset the search box (used when a category/sub is chosen — that's a fresh browse).
    function clearSearchUI() {
      searchQuery = '';
      const input = document.getElementById('search-input');
      const clear = document.getElementById('search-clear');
      if (input) input.value = '';
      if (clear) clear.hidden = true;
    }

    function renderSidebar() {
      const mkBtn = (val, label) => {
        const active = (activeFilter === val) || (!activeFilter && val === '') ? 'active' : '';
        return `<button class="filter-btn ${active}" data-filter="${val}">${label}</button>`;
      };
      const pills = [mkBtn('', 'All')]
        .concat(filterCategories().map(c => mkBtn(c, c)))
        .join('');
      document.getElementById('sidebar').innerHTML = `<div class="filter-bar">${pills}</div>`;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter || null;
          activeSub = null;            // reset sub-section when the category changes
          clearSearchUI();             // a category pick starts a fresh browse
          updateUrl();
          render();
        });
      });

      // Keep the active pill in view on the mobile scroll bar.
      const activeBtn = document.querySelector('.filter-btn.active');
      const bar = document.querySelector('.filter-bar');
      if (activeBtn && bar) bar.scrollTo({ left: activeBtn.offsetLeft - 16, behavior: 'smooth' });
    }

    // Sub-navigation (dropdown on desktop, scroll row on mobile) for categories
    // that have sub-sections, e.g. Bubble Tea.
    function renderSubnav() {
      const host = document.getElementById('subnav');
      const subs = (typeof subcategoriesFor === 'function') ? subcategoriesFor(activeFilter) : [];
      if (!activeFilter || !subs.length) { host.innerHTML = ''; return; }

      const opts = [{ v: '', label: 'All ' + activeFilter }].concat(subs.map(s => ({ v: s, label: s })));
      const selOpts = opts.map(o =>
        `<option value="${o.v}" ${activeSub === o.v || (!activeSub && o.v === '') ? 'selected' : ''}>${o.label}</option>`).join('');
      const rowPills = opts.map(o =>
        `<button class="sub-pill ${activeSub === o.v || (!activeSub && o.v === '') ? 'active' : ''}" data-sub="${o.v}">${o.label}</button>`).join('');

      host.innerHTML = `
        <div class="subnav">
          <select class="subnav-select" aria-label="Filter ${activeFilter}">${selOpts}</select>
          <div class="subnav-row">${rowPills}</div>
        </div>`;

      host.querySelector('.subnav-select').addEventListener('change', e => {
        activeSub = e.target.value || null; clearSearchUI(); updateUrl(); render();
      });
      host.querySelectorAll('.sub-pill').forEach(b => {
        b.addEventListener('click', () => { activeSub = b.dataset.sub || null; clearSearchUI(); updateUrl(); render(); });
      });
      const activePill = host.querySelector('.sub-pill.active');
      const row = host.querySelector('.subnav-row');
      if (activePill && row) row.scrollTo({ left: activePill.offsetLeft - 16, behavior: 'smooth' });
    }

    function productCard(p) {
      // Show only the headline category (cross tags stay internal).
      const cat = primaryCategory(p);
      const chips = cat ? `<span class="tag-chip cat">${cat}</span>` : '';
      return `
        <article class="card">
          <a class="card-media" href="product.html?id=${p.id}">
            <div class="card-tags">${chips}</div>
            <img src="${productImage(p, 0)}" alt="${p.title}" loading="lazy">
          </a>
          <div class="card-body">
            <h3><a href="product.html?id=${p.id}">${p.title}</a></h3>
            <p class="card-desc">${p.shortDesc}</p>
            <div class="card-foot">
              <span class="price">${hasSizeChoice(p) ? '<span class="from">from </span>' : ''}${money(p.price)}<span class="from"> / ${p.unit}</span></span>
              <a class="btn ghost" href="product.html?id=${p.id}">View</a>
            </div>
          </div>
        </article>`;
    }

    // Match a product against every word in the query (across name, description,
    // category, sub-section and tags), so multi-word searches narrow results.
    function matchesSearch(p, terms) {
      const hay = [p.title, p.shortDesc, primaryCategory(p), p.section, (p.tags || []).join(' ')]
        .filter(Boolean).join(' ').toLowerCase();
      return terms.every(t => hay.includes(t));
    }

    function render() {
      renderSidebar();
      renderSubnav();
      let list;
      if (searchQuery) {
        // Search spans the whole catalog, regardless of the active category.
        const terms = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
        list = PRODUCTS.filter(p => matchesSearch(p, terms));
        document.getElementById('listing-title').textContent = `Results for “${searchQuery}”`;
      } else {
        list = activeFilter ? PRODUCTS.filter(p => p.tags.includes(activeFilter)) : PRODUCTS;
        if (activeSub) list = list.filter(p => p.section === activeSub);
        document.getElementById('listing-title').textContent = activeSub || activeFilter || 'All Products';
      }
      document.getElementById('listing-count').textContent =
        `${list.length} ${list.length === 1 ? 'item' : 'items'}`;
      document.getElementById('grid').innerHTML = list.map(productCard).join('');
      const empty = document.getElementById('empty');
      empty.style.display = list.length ? 'none' : 'block';
      if (!list.length) {
        empty.querySelector('p').textContent = searchQuery
          ? `No products match “${searchQuery}”.`
          : 'No products match this filter just yet.';
      }
    }

    function applyHero() {
      if (typeof SETTINGS === 'undefined') return;
      const t = document.getElementById('hero-title');
      const s = document.getElementById('hero-subtitle');
      if (t && SETTINGS.heroTitle) t.innerHTML = SETTINGS.heroTitle.replace(/\n/g, '<br>');
      if (s && SETTINGS.heroSubtitle) s.textContent = SETTINGS.heroSubtitle;
    }

    function initSearch() {
      const input = document.getElementById('search-input');
      const clear = document.getElementById('search-clear');
      if (!input) return;
      input.value = searchQuery;        // restore from ?q= on load
      clear.hidden = !searchQuery;
      input.addEventListener('input', () => {
        searchQuery = input.value.trim();
        clear.hidden = !searchQuery;
        updateUrl();
        render();
      });
      clear.addEventListener('click', () => {
        clearSearchUI();
        input.focus();
        updateUrl();
        render();
      });
    }

    // Load CMS content (if configured), then render. Falls back to built-in data.
    (window.loadStore ? window.loadStore() : Promise.resolve()).then(() => {
      applyHero();
      initSearch();
      render();
    });
  </script>
</body>
</html>
