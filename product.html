<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Served at /product/<slug> via rewrite, so resolve all relative URLs from root -->
  <base href="/">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Product — Sofnade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a8a'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23ffc629'%3ES%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=52">
</head>
<body>
  <div id="header"></div>

  <!-- Mobile only: how much more to free delivery, above the content -->
  <div id="freeship-mobile" class="freeship-mobile"></div>

  <div class="wrap">
    <div class="breadcrumb" id="crumb"></div>
    <div id="pdp"></div>

    <section class="section" id="also-bought-section" style="display:none">
      <h2>Customers also bought</h2>
      <div class="grid" id="also-bought"></div>
    </section>
  </div>

  <div id="footer"></div>

  <script src="data/products.js?v=52"></script>
  <script src="js/config.js?v=52"></script>
  <script src="js/store-data.js?v=52"></script>
  <script src="js/images.js?v=52"></script>
  <script src="js/cart.js?v=52"></script>
  <script src="js/common.js?v=52"></script>
  <script src="js/pdp.js?v=52"></script>
  <script>
    renderChrome();


    /* Entry point — load CMS content (if configured), then render. If the slug
       is missing from the loaded catalog, try a direct single-product lookup
       from the CMS before giving up (covers new/renamed slugs and any partial
       catalog load). */
    (window.loadStore ? window.loadStore() : Promise.resolve()).then(async () => {
      const slug = currentSlug();
      let product = getProduct(slug);
      if ((!product || !product.tags) && window.fetchProductBySlug) {
        console.warn('[Sofnade] slug not in catalog, trying direct lookup:', slug);
        product = await fetchProductBySlug(slug);
      }
      if (!product || !product.tags) {
        document.getElementById('pdp').innerHTML =
          `<div class="empty-state"><div class="big">😕</div>
           <p>We couldn't find “${(slug || '').replace(/[<>&"]/g, '')}”. It may have been renamed or removed.<br>
           <a href="index.html">Back to shop</a></p></div>`;
      } else {
        renderPDP(product);
      }
      if (window.updateFreeshipMobile) updateFreeshipMobile(); // reflect CMS threshold
    });
  </script>
</body>
</html>
