<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sofnade — Orders (Staff)</title>
  <style>
    :root { --navy:#16224a; --gold:#ffc629; --line:#e5e7eb; --muted:#6b7280; --bg:#f6f7fb; --ok:#1a7f4b; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; color:#1b2330; background:var(--bg); }
    header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:6; }
    header h1 { font-size:18px; margin:0; flex:1; }
    header .who { color:#c9d4f0; font-size:13px; }
    .wrap { max-width:1040px; margin:0 auto; padding:18px 20px 60px; }
    button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-weight:600; }
    .btn-gold { background:var(--gold); color:var(--navy); }
    .btn-ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4); }
    .btn-light { background:#eef1f8; color:var(--navy); }
    .btn-sm { padding:6px 10px; font-size:13px; }
    .btn-wa { display:inline-flex; align-items:center; gap:6px; background:#25D366; color:#fff; border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; text-decoration:none; }
    .btn-wa:hover { background:#1da851; }
    select, textarea, input { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; }
    textarea { resize:vertical; min-height:46px; width:100%; }
    .muted { color:var(--muted); }

    /* Filter bar */
    .filters { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:16px; position:sticky; top:60px; z-index:5; }
    .filters .line { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
    .fg { display:flex; flex-direction:column; gap:3px; }
    .fg label { font-size:12px; font-weight:600; color:#374151; }
    .fg input, .fg select { height:38px; }
    #search { width:280px; max-width:60vw; }
    .num { width:96px; }
    .count { margin-left:auto; align-self:center; font-size:13px; }

    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
    .top { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
    .top .grow { flex:1; min-width:140px; }
    .id { font-family:ui-monospace,monospace; font-weight:700; color:var(--navy); }
    .total { font-weight:700; font-size:17px; }
    .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700; text-transform:capitalize; }
    .s-created{background:#fff3cd;color:#7a5b00}.s-paid{background:#d7f0e0;color:#1a7f4b}
    .s-preparing{background:#dbe7ff;color:#1d4ed8}.s-out_for_delivery{background:#e7defb;color:#6b21a8}
    .s-completed{background:#e2e8f0;color:#334155}.s-cancelled{background:#fde2e1;color:#b42318}
    .info { display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; margin:10px 0; font-size:14px; }
    @media(max-width:640px){ .info{grid-template-columns:1fr} }
    .info b { color:#374151; font-weight:600; }
    .items { margin:6px 0; padding-left:18px; font-size:14px; }
    .totals { font-size:13px; color:var(--muted); margin-top:4px; }
    .edit { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
    .ef { display:flex; flex-direction:column; gap:3px; }
    .ef.grow { flex:1; min-width:200px; }
    .ef label { font-size:12px; font-weight:600; color:#374151; }
    .ef select, .ef input { height:38px; }
    .ef select { min-width:150px; }
    .ef.who select { width:150px; }
    .ef.act { flex-direction:row; align-items:center; gap:10px; }
    .saved { color:var(--ok); font-size:13px; font-weight:600; }
    .ref { font-size:12px; color:var(--muted); margin-top:6px; }
    /* Inline "add staff" box */
    .addbox { display:inline-flex; align-items:center; gap:6px; }
    .addinput { height:38px; width:150px; }
    .addx { background:#eef1f8; color:#475569; border:none; border-radius:8px; height:32px; width:32px; font-size:18px; line-height:1; cursor:pointer; }
    .addx:hover { background:#e2e6f0; }
    /* Collapsible vertical status timeline (right-aligned) */
    .tl-toggle { background:#eef1f8; color:var(--navy); border:none; border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
    .tl-toggle.open { background:var(--navy); color:#fff; }
    .timeline { margin:12px 0 0 auto; max-width:340px; border-left:2px solid #e5e7eb; padding-left:24px; }
    .tl-item { position:relative; padding:0 0 14px; }
    .tl-item:last-child { padding-bottom:2px; }
    .tl-dot { position:absolute; left:-36px; top:0; width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 3px #fff; }
    .tl-time { font-size:11px; color:var(--muted); margin-bottom:1px; }
    .tl-status { font-weight:700; color:#1b2330; font-size:14px; text-transform:capitalize; }
    .tl-desc { font-size:13px; color:#374151; margin-top:1px; }
    .tl-by { color:var(--muted); }
    .op { width:140px; height:32px; border-radius:8px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#fff; padding:5px 9px; }
    .op::placeholder { color:#aebbe0; }
    @keyframes flashbg { from { background:#e7f7ee; } to { background:#fff; } }
    .card.flash { animation: flashbg 1.4s ease; }

    .login { max-width:380px; margin:10vh auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px; }
    .login h2 { margin:0 0 6px; color:var(--navy); }
    .error { color:#b42318; font-size:14px; margin-top:8px; min-height:18px; }
    .hide { display:none !important; }
  </style>
</head>
<body>
  <div id="login" class="login">
    <h2>Sofnade Orders</h2>
    <p class="muted" style="margin-top:0">Staff access. Enter the shared password.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="width:100%" />
    <button class="btn-gold" style="width:100%;margin-top:10px" onclick="login()">Sign in</button>
    <div id="login-error" class="error"></div>
  </div>

  <div id="app" class="hide">
    <header>
      <h1>Sofnade Orders</h1>
      <input id="operator" class="op" placeholder="You (name)" title="Your name — recorded on status changes" oninput="saveOperator()" />
      <button class="btn-ghost btn-sm" onclick="load()">Refresh</button>
      <button class="btn-ghost btn-sm" onclick="logout()">Sign out</button>
    </header>
    <div class="wrap">
      <div class="filters">
        <div class="line">
          <div class="fg">
            <label>Search</label>
            <input id="search" placeholder="Order id, name, phone, email, item, notes…" oninput="applyFilters()" />
          </div>
          <div class="fg">
            <label>Status</label>
            <select id="f-status" onchange="applyFilters()">
              <option value="">All</option>
              <option value="created">Created (unpaid)</option>
              <option value="paid">Paid</option>
              <option value="preparing">Preparing</option>
              <option value="out_for_delivery">Out for delivery</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="fg">
            <label>From (order date)</label>
            <input id="f-from" type="date" onchange="applyFilters()" />
          </div>
          <div class="fg">
            <label>To</label>
            <input id="f-to" type="date" onchange="applyFilters()" />
          </div>
          <div class="fg">
            <label>Min $</label>
            <input id="f-min" class="num" type="number" min="0" step="1" inputmode="decimal" oninput="applyFilters()" />
          </div>
          <div class="fg">
            <label>Max $</label>
            <input id="f-max" class="num" type="number" min="0" step="1" inputmode="decimal" oninput="applyFilters()" />
          </div>
          <button class="btn-light btn-sm" onclick="clearFilters()">Clear</button>
          <span id="count" class="count muted"></span>
        </div>
      </div>
      <div id="list"></div>
      <div id="empty" class="muted hide" style="text-align:center;padding:40px">No orders match.</div>
    </div>
  </div>

  <script>
    const STATUSES = ['created','paid','preparing','out_for_delivery','completed','cancelled'];
    const PW_KEY = 'sofnade_admin_pw';
    let pw = sessionStorage.getItem(PW_KEY) || '';
    let ALL = [];
    let STAFF = [];

    function saveOperator() { localStorage.setItem('sofnade_operator', document.getElementById('operator').value || ''); }

    // <option>s for a Preparer/Driver dropdown: unassigned, the roster, any
    // legacy value not in the roster, then an "add new" action.
    function staffOptions(selected) {
      const names = STAFF.slice();
      if (selected && !names.includes(selected)) names.unshift(selected);
      const opts = ['<option value="">— unassigned —</option>'];
      names.forEach(n => opts.push(`<option value="${esc(n)}" ${n === selected ? 'selected' : ''}>${esc(n)}</option>`));
      opts.push('<option value="__add__">➕ Add new…</option>');
      return opts.join('');
    }
    function rebuildAllStaffSelects() {
      document.querySelectorAll('select[data-preparer], select[data-driver]').forEach(sel => {
        const cur = sel.value === '__add__' ? '' : sel.value;
        sel.innerHTML = staffOptions(cur);
        sel.value = cur;
      });
    }
    function onStaffChange(sel) { if (sel.value === '__add__') enterAddMode(sel); }

    // Swap the dropdown for an inline name input: Enter/Add saves, Esc/× cancels.
    function enterAddMode(sel) {
      const id = sel.getAttribute('data-preparer') || sel.getAttribute('data-driver');
      const field = sel.hasAttribute('data-preparer') ? 'preparer' : 'driver';
      const box = document.createElement('span');
      box.className = 'addbox';
      box.innerHTML = '<input class="addinput" placeholder="New name" maxlength="60" />' +
                      '<button class="btn-gold btn-sm" type="button">Add</button>' +
                      '<button class="addx" type="button" title="Cancel">×</button>';
      sel.style.display = 'none';
      sel.insertAdjacentElement('afterend', box);
      const input = box.querySelector('.addinput');
      input.focus();

      const restore = (value) => { sel.innerHTML = staffOptions(value); sel.value = value; sel.style.display = ''; box.remove(); };
      const cancel = () => { const o = ALL.find(x => x.id === id) || {}; restore(o[field] || ''); };
      const commit = async () => {
        const name = input.value.trim();
        if (!name) { cancel(); return; }
        const addBtn = box.querySelector('.btn-gold'); addBtn.disabled = true; addBtn.textContent = '…';
        try {
          const { staff } = await api('POST', '/staff', { name });
          STAFF = staff || STAFF;
        } catch (e) {
          if (e.message !== 'unauthorized') alert('Could not add: ' + e.message);
          cancel(); return;
        }
        restore(name);
        rebuildAllStaffSelects(); // make the new name available in every dropdown
      };
      box.querySelector('.btn-gold').addEventListener('click', commit);
      box.querySelector('.addx').addEventListener('click', cancel);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
    }

    function toggleTimeline(btn) {
      const tl = btn.closest('.card').querySelector('.timeline');
      if (tl) { tl.classList.toggle('hide'); btn.classList.toggle('open'); }
    }

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const money = (n, c) => `${c || 'SGD'} ${Number(n || 0).toFixed(2)}`;
    const when = (iso) => { try { return new Date(iso).toLocaleString('en-SG', { dateStyle:'medium', timeStyle:'short', timeZone:'Asia/Singapore' }); } catch { return iso || ''; } };
    // Order date in Singapore time as YYYY-MM-DD (for the date filters).
    const sgDate = (iso) => { try { return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso)); } catch { return (iso||'').slice(0,10); } };
    const cssEsc = (s) => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g,'\\$&');
    // Normalise a phone to wa.me digits (international, no +). Singapore default.
    function waNumber(phone) {
      if (!phone) return '';
      let d = String(phone).replace(/[^\d]/g, '');
      if (d.startsWith('00')) d = d.slice(2);   // drop international dialing prefix
      if (d.length === 8) d = '65' + d;          // bare SG local number -> add +65
      return d;
    }

    // ---- Status timeline ----------------------------------------------------
    const STATUS_META = {
      created:          { color: '#6b7280', icon: '🧾' },
      paid:             { color: '#1a7f4b', icon: '✓' },
      preparing:        { color: '#1d4ed8', icon: '⏳' },
      out_for_delivery: { color: '#6b21a8', icon: '🚚' },
      completed:        { color: '#1a7f4b', icon: '✓' },
      cancelled:        { color: '#b42318', icon: '✕' },
    };
    const STATUS_DEFAULT = { color: '#6b7280', icon: '•' };
    const cap = (s) => { s = String(s || '').replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); };

    // Use the recorded log; if empty (older orders), synthesise from the
    // created/paid timestamps so every order still shows a timeline.
    function timelineEvents(o) {
      let ev = Array.isArray(o.status_history) ? o.status_history.slice() : [];
      if (!ev.length) {
        ev = [];
        if (o.created_at) ev.push({ status: 'created', at: o.created_at, by: 'system' });
        if (o.paid_at) ev.push({ status: 'paid', at: o.paid_at, by: 'payment' });
        if (o.status && !ev.some(e => e.status === o.status)) ev.push({ status: o.status, at: o.updated_at || null, by: null });
      }
      return ev;
    }
    function tlDesc(cur, prev) {
      if (cur === 'created') return 'Order created.';
      if (cur === 'paid') return 'Payment received.';
      if (prev) return `Order status changed from ${cap(prev)} to ${cap(cur)}.`;
      return `Order status set to ${cap(cur)}.`;
    }
    // Newest-first, with a coloured status icon per entry (like the reference).
    function renderTimeline(events) {
      const decorated = events.map((h, i) => ({ ...h, desc: tlDesc(h.status, i > 0 ? events[i - 1].status : null) }));
      return decorated.slice().reverse().map(h => {
        const m = STATUS_META[h.status] || STATUS_DEFAULT;
        const by = (h.by && h.by !== 'system' && h.by !== 'payment') ? ` <span class="tl-by">by ${esc(h.by)}</span>` : '';
        return `<div class="tl-item">
          <span class="tl-dot" style="background:${m.color}">${m.icon}</span>
          <div class="tl-time">${h.at ? when(h.at) : ''}</div>
          <div class="tl-status">${esc(cap(h.status))}</div>
          <div class="tl-desc">${esc(h.desc)}${by}</div>
        </div>`;
      }).join('');
    }

    async function api(method, path, body) {
      const opEl = document.getElementById('operator');
      const opts = { method, headers: { 'x-admin-password': pw, 'x-operator': (opEl && opEl.value || '').trim() } };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch('/api/admin' + path, opts);
      if (res.status === 401) { logout('Wrong password.'); throw new Error('unauthorized'); }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
      return json;
    }

    function login() {
      pw = document.getElementById('pw').value;
      sessionStorage.setItem(PW_KEY, pw);
      document.getElementById('login-error').textContent = '';
      load(true);
    }
    function logout(msg) {
      sessionStorage.removeItem(PW_KEY); pw = '';
      document.getElementById('app').classList.add('hide');
      document.getElementById('login').classList.remove('hide');
      document.getElementById('login-error').textContent = msg || '';
    }
    function clearFilters() {
      ['search','f-from','f-to','f-min','f-max'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f-status').value = '';
      applyFilters();
    }

    function orderCard(o) {
      const c = o.customer || {}; const q = o.quote || {};
      const items = (q.items || []).map(i => `<li>${i.qty}× ${esc(i.title)} <span class="muted">(${esc(i.size)})</span> — ${money(i.lineTotal, q.currency)}</li>`).join('');
      const addr = o.fulfilment === 'delivery'
        ? ([c.address1, c.address2, o.postal].filter(Boolean).map(esc).join(', ') || '—')
        : 'Self pick-up';
      const statusOpts = STATUSES.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s.replace(/_/g,' ')}</option>`).join('');
      const wa = waNumber(c.phone);
      const waMsg = encodeURIComponent(`Hi ${c.name || ''}, this is Sofnade about your order ${o.id}.`.replace(/\s+/g, ' ').trim());
      const waBtn = wa ? `<a class="btn-wa" href="https://wa.me/${wa}?text=${waMsg}" target="_blank" rel="noopener">WhatsApp customer</a>` : '';
      const tlEvents = timelineEvents(o);
      const tlHtml = renderTimeline(tlEvents);
      const tlToggle = tlEvents.length ? `<button class="tl-toggle" type="button" onclick="toggleTimeline(this)">Timeline (${tlEvents.length})</button>` : '';
      return `
      <div class="card" data-card="${esc(o.id)}">
        <div class="top">
          <div class="grow">
            <span class="id">${esc(o.id)}</span>
            <span class="pill s-${esc(o.status)}">${esc((o.status||'').replace(/_/g,' '))}</span>
          </div>
          <div class="total">${money(o.amount_total, o.currency)}</div>
          ${tlToggle}
        </div>
        <div class="muted" style="font-size:13px;margin-top:2px">Placed ${when(o.created_at)}${o.updated_at ? ' · edited ' + when(o.updated_at) : ''}</div>

        <div class="info">
          <div><b>Customer:</b> ${esc(c.name||'—')}</div>
          <div><b>Phone:</b> ${esc(c.phone||'—')}</div>
          <div><b>Email:</b> ${esc(c.email||'—')}</div>
          <div><b>${o.fulfilment === 'delivery' ? 'Deliver to' : 'Fulfilment'}:</b> ${addr}</div>
          <div><b>When:</b> ${o.delivery_date ? esc(o.delivery_date) + (o.slot_or_window ? ' (' + esc(o.slot_or_window) + ')' : '') : '—'}</div>
          ${c.notes ? `<div><b>Customer note:</b> ${esc(c.notes)}</div>` : ''}
        </div>

        ${waBtn ? `<div style="margin:2px 0 10px">${waBtn}</div>` : ''}

        <div><b style="font-size:14px;color:#374151">Items</b><ul class="items">${items || '<li class="muted">no items</li>'}</ul></div>
        <div class="totals">Subtotal ${money(q.subtotal,q.currency)}${q.discount ? ' · Discount -' + money(q.discount,q.currency) : ''} · Delivery ${money(q.deliveryFee,q.currency)}${q.surcharge ? ' · Surcharge ' + money(q.surcharge,q.currency) : ''}${q.specificTimeFee ? ' · Specific-time ' + money(q.specificTimeFee,q.currency) : ''} · <b>Total ${money(q.total,q.currency)}</b></div>
        ${o.razorpay_payment_id ? `<div class="ref">Razorpay ${esc(o.razorpay_order_id)} / ${esc(o.razorpay_payment_id)}</div>` : ''}
        ${tlHtml ? `<div class="timeline hide">${tlHtml}</div>` : ''}

        <div class="edit">
          <div class="ef"><label>Status</label><select data-status="${esc(o.id)}">${statusOpts}</select></div>
          <div class="ef who"><label>Preparer</label><select data-preparer="${esc(o.id)}" onchange="onStaffChange(this)">${staffOptions(o.preparer)}</select></div>
          <div class="ef who"><label>Driver</label><select data-driver="${esc(o.id)}" onchange="onStaffChange(this)">${staffOptions(o.driver)}</select></div>
          <div class="ef grow"><label>Staff notes</label><textarea data-notes="${esc(o.id)}" placeholder="e.g. called customer, packed, special request…">${esc(o.staff_notes)}</textarea></div>
          <div class="ef act"><button class="btn-gold btn-sm" onclick="save('${esc(o.id)}', this)">Save</button><span class="saved hide">Saved ✓</span></div>
        </div>
      </div>`;
    }

    function render(orders) {
      document.getElementById('list').innerHTML = orders.map(orderCard).join('');
      document.getElementById('empty').classList.toggle('hide', orders.length > 0);
    }

    function applyFilters() {
      const terms = document.getElementById('search').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const st = document.getElementById('f-status').value;
      const from = document.getElementById('f-from').value;
      const to = document.getElementById('f-to').value;
      const min = parseFloat(document.getElementById('f-min').value);
      const max = parseFloat(document.getElementById('f-max').value);

      const filtered = ALL.filter(o => {
        if (st && o.status !== st) return false;
        const d = sgDate(o.created_at);
        if (from && d < from) return false;
        if (to && d > to) return false;
        const amt = Number(o.amount_total || 0);
        if (!isNaN(min) && amt < min) return false;
        if (!isNaN(max) && amt > max) return false;
        if (terms.length) {
          const c = o.customer || {};
          const itemText = (o.quote && o.quote.items || []).map(i => i.title).join(' ');
          const hay = [o.id, c.name, c.phone, c.email, itemText, o.status, o.staff_notes, o.preparer, o.driver].filter(Boolean).join(' ').toLowerCase();
          if (!terms.every(t => hay.includes(t))) return false;
        }
        return true;
      });
      render(filtered);
      document.getElementById('count').textContent = `Showing ${filtered.length} of ${ALL.length}`;
    }

    async function save(id, btn) {
      btn.disabled = true; const old = btn.textContent; btn.textContent = 'Saving…';
      const val = (sel) => { const el = document.querySelector(sel); return el ? el.value : undefined; };
      const norm = (v) => (v === '__add__' ? '' : v);
      const patch = {
        id,
        status: val(`[data-status="${cssEsc(id)}"]`),
        staff_notes: val(`[data-notes="${cssEsc(id)}"]`),
        preparer: norm(val(`[data-preparer="${cssEsc(id)}"]`)),
        driver: norm(val(`[data-driver="${cssEsc(id)}"]`)),
      };
      try {
        const { order } = await api('PATCH', '/orders', patch);
        const idx = ALL.findIndex(o => o.id === id);
        if (idx >= 0 && order) ALL[idx] = order;       // keep filters/search consistent
        const card = document.querySelector(`[data-card="${cssEsc(id)}"]`);
        if (order && card) {
          // Re-render the card so the status log, pill, and edits all refresh.
          const tmp = document.createElement('div'); tmp.innerHTML = orderCard(order);
          const fresh = tmp.firstElementChild;
          card.replaceWith(fresh);
          fresh.classList.add('flash');
        }
      } catch (e) { if (e.message !== 'unauthorized') { alert('Could not save: ' + e.message); btn.disabled = false; btn.textContent = old; } }
    }

    async function load(fromLogin) {
      try {
        const [ordersRes, staffRes] = await Promise.all([
          api('GET', '/orders?limit=500'),
          api('GET', '/staff').catch(() => ({ staff: [] })),
        ]);
        ALL = ordersRes.orders || [];
        STAFF = staffRes.staff || [];
        document.getElementById('login').classList.add('hide');
        document.getElementById('app').classList.remove('hide');
        applyFilters();
      } catch (e) {
        if (e.message === 'unauthorized') return;
        if (fromLogin) document.getElementById('login-error').textContent = e.message;
        else alert('Could not load orders: ' + e.message);
      }
    }

    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    document.getElementById('operator').value = localStorage.getItem('sofnade_operator') || '';
    if (pw) load();
  </script>
</body>
</html>
