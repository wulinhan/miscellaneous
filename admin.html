<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sofnade — Orders (Staff)</title>
  <style>
    :root { --navy:#16224a; --navy2:#0f1838; --gold:#ffc629; --line:#e5e7eb; --muted:#6b7280; --bg:#f6f7fb; --ok:#1a7f4b; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; color:#1b2330; background:var(--bg); }
    header { background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
    header h1 { font-size:18px; margin:0; flex:1; }
    header .who { color:#c9d4f0; font-size:13px; }
    .wrap { max-width:1000px; margin:0 auto; padding:20px; }
    button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-weight:600; }
    .btn-gold { background:var(--gold); color:var(--navy); }
    .btn-ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4); }
    .btn-sm { padding:6px 10px; font-size:13px; }
    select, textarea, input { font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; background:#fff; }
    textarea { resize:vertical; min-height:46px; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar .grow { flex:1; }
    .muted { color:var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .row .grow { flex:1; min-width:160px; }
    .id { font-family:ui-monospace,monospace; font-weight:700; color:var(--navy); }
    .total { font-weight:700; }
    .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700; }
    .s-created{background:#fff3cd;color:#7a5b00}.s-paid{background:#d7f0e0;color:#1a7f4b}
    .s-preparing{background:#dbe7ff;color:#1d4ed8}.s-out_for_delivery{background:#e7defb;color:#6b21a8}
    .s-completed{background:#e2e8f0;color:#334155}.s-cancelled{background:#fde2e1;color:#b42318}
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    @media(max-width:640px){ .grid2{grid-template-columns:1fr} }
    .field label { display:block; font-size:13px; font-weight:600; margin-bottom:4px; color:#374151; }
    details summary { cursor:pointer; color:var(--navy); font-weight:600; font-size:14px; margin-top:10px; }
    .detail { margin-top:10px; font-size:14px; }
    .detail b { color:#374151; }
    .items { margin:8px 0 0; padding-left:18px; }
    .saved { color:var(--ok); font-size:13px; font-weight:600; }
    .login { max-width:380px; margin:10vh auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px; }
    .login h2 { margin:0 0 6px; color:var(--navy); }
    .error { color:#b42318; font-size:14px; margin-top:8px; min-height:18px; }
    .hide { display:none !important; }
  </style>
</head>
<body>
  <!-- Login gate -->
  <div id="login" class="login">
    <h2>Sofnade Orders</h2>
    <p class="muted" style="margin-top:0">Staff access. Enter the shared password.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button class="btn-gold" style="width:100%;margin-top:10px" onclick="login()">Sign in</button>
    <div id="login-error" class="error"></div>
  </div>

  <!-- App -->
  <div id="app" class="hide">
    <header>
      <h1>Sofnade Orders</h1>
      <span id="count" class="who"></span>
      <button class="btn-ghost btn-sm" onclick="logout()">Sign out</button>
    </header>
    <div class="wrap">
      <div class="toolbar">
        <select id="filter" style="width:auto" onchange="load()">
          <option value="">All statuses</option>
          <option value="created">Created (unpaid)</option>
          <option value="paid">Paid</option>
          <option value="preparing">Preparing</option>
          <option value="out_for_delivery">Out for delivery</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <span class="grow"></span>
        <button class="btn-gold btn-sm" onclick="load()">Refresh</button>
      </div>
      <div id="list"></div>
      <div id="empty" class="muted hide" style="text-align:center;padding:40px">No orders yet.</div>
    </div>
  </div>

  <script>
    const STATUSES = ['created','paid','preparing','out_for_delivery','completed','cancelled'];
    const PW_KEY = 'sofnade_admin_pw';
    let pw = sessionStorage.getItem(PW_KEY) || '';

    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const money = (n, c) => `${c || 'SGD'} ${Number(n || 0).toFixed(2)}`;
    const when = (iso) => { try { return new Date(iso).toLocaleString('en-SG', { dateStyle:'medium', timeStyle:'short' }); } catch { return iso || ''; } };

    async function api(method, body) {
      const opts = { method, headers: { 'x-admin-password': pw } };
      if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const qs = (method === 'GET' && document.getElementById('filter').value)
        ? `?status=${encodeURIComponent(document.getElementById('filter').value)}` : '';
      const res = await fetch('/api/admin/orders' + qs, opts);
      if (res.status === 401) { logout('Wrong password.'); throw new Error('unauthorized'); }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
      return json;
    }

    function login() {
      pw = document.getElementById('pw').value;
      sessionStorage.setItem(PW_KEY, pw);
      document.getElementById('login-error').textContent = '';
      load(true);
    }
    function logout(msg) {
      sessionStorage.removeItem(PW_KEY); pw = '';
      document.getElementById('app').classList.add('hide');
      document.getElementById('login').classList.remove('hide');
      document.getElementById('login-error').textContent = msg || '';
    }

    function statusSelect(order) {
      return `<select data-status="${esc(order.id)}">` +
        STATUSES.map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s.replace(/_/g,' ')}</option>`).join('') +
        `</select>`;
    }

    function orderCard(o) {
      const c = o.customer || {}; const q = o.quote || {};
      const items = (q.items || []).map(i => `<li>${i.qty}× ${esc(i.title)} <span class="muted">(${esc(i.size)})</span> — ${money(i.lineTotal, q.currency)}</li>`).join('');
      const addr = o.fulfilment === 'delivery'
        ? [c.address1, c.address2, o.postal].filter(Boolean).map(esc).join(', ')
        : 'Self pick-up';
      return `
      <div class="card" data-card="${esc(o.id)}">
        <div class="row">
          <div class="grow">
            <span class="id">${esc(o.id)}</span>
            <span class="pill s-${esc(o.status)}">${esc((o.status||'').replace(/_/g,' '))}</span>
            <div class="muted" style="font-size:13px">${esc(c.name||'')} · ${esc(c.phone||'')} · ${when(o.created_at)}</div>
          </div>
          <div class="total">${money(o.amount_total, o.currency)}</div>
        </div>

        <div class="grid2">
          <div class="field">
            <label>Status</label>
            ${statusSelect(o)}
          </div>
          <div class="field">
            <label>Staff notes</label>
            <textarea data-notes="${esc(o.id)}" placeholder="e.g. called customer, packed, special request…">${esc(o.staff_notes)}</textarea>
          </div>
        </div>

        <div class="row" style="margin-top:10px">
          <button class="btn-gold btn-sm" onclick="save('${esc(o.id)}', this)">Save</button>
          <span class="saved hide">Saved ✓</span>
          <span class="grow"></span>
          ${o.updated_at ? `<span class="muted" style="font-size:12px">edited ${when(o.updated_at)}</span>` : ''}
        </div>

        <details>
          <summary>Order details</summary>
          <div class="detail">
            <div><b>Email:</b> ${esc(c.email||'')}</div>
            <div><b>${o.fulfilment === 'delivery' ? 'Deliver to' : 'Fulfilment'}:</b> ${addr}</div>
            ${o.delivery_date ? `<div><b>When:</b> ${esc(o.delivery_date)}${o.slot_or_window ? ' (' + esc(o.slot_or_window) + ')' : ''}</div>` : ''}
            ${c.notes ? `<div><b>Customer note:</b> ${esc(c.notes)}</div>` : ''}
            <ul class="items">${items || '<li class="muted">no items</li>'}</ul>
            <div class="muted" style="font-size:12px;margin-top:6px">Subtotal ${money(q.subtotal,q.currency)} · Delivery ${money(q.deliveryFee,q.currency)} · Surcharge ${money(q.surcharge,q.currency)} · Total ${money(q.total,q.currency)}</div>
            ${o.razorpay_payment_id ? `<div class="muted" style="font-size:12px">Razorpay ${esc(o.razorpay_order_id)} / ${esc(o.razorpay_payment_id)}</div>` : ''}
          </div>
        </details>
      </div>`;
    }

    async function save(id, btn) {
      btn.disabled = true; const old = btn.textContent; btn.textContent = 'Saving…';
      const status = document.querySelector(`[data-status="${cssEsc(id)}"]`).value;
      const staff_notes = document.querySelector(`[data-notes="${cssEsc(id)}"]`).value;
      try {
        await api('PATCH', { id, status, staff_notes });
        const card = document.querySelector(`[data-card="${cssEsc(id)}"]`);
        const tag = card.querySelector('.saved'); tag.classList.remove('hide');
        const pill = card.querySelector('.pill');
        pill.className = 'pill s-' + status; pill.textContent = status.replace(/_/g,' ');
        setTimeout(() => tag.classList.add('hide'), 1800);
      } catch (e) { alert('Could not save: ' + e.message); }
      btn.disabled = false; btn.textContent = old;
    }
    // CSS.escape fallback for attribute selectors with our SOF- ids (safe chars).
    function cssEsc(s){ return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g,'\\$&'); }

    async function load(fromLogin) {
      try {
        const { orders } = await api('GET');
        document.getElementById('login').classList.add('hide');
        document.getElementById('app').classList.remove('hide');
        const list = document.getElementById('list');
        list.innerHTML = (orders || []).map(orderCard).join('');
        document.getElementById('empty').classList.toggle('hide', (orders || []).length > 0);
        document.getElementById('count').textContent = `${(orders||[]).length} order${(orders||[]).length===1?'':'s'}`;
      } catch (e) {
        if (e.message === 'unauthorized') return;
        if (fromLogin) document.getElementById('login-error').textContent = e.message;
        else alert('Could not load orders: ' + e.message);
      }
    }

    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    if (pw) load(); // try stored password on load
  </script>
</body>
</html>
